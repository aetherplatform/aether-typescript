name: Bootstrap SDK Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sdk-bootstrap-release
  cancel-in-progress: false

jobs:
  bootstrap:
    if: vars.AETHER_SDK_BOOTSTRAP_RELEASE_ENABLED == 'true' && vars.AETHER_SDK_RELEASE_ENABLED != 'true'
    runs-on: ubuntu-latest
    environment: sdk-sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - run: npm run test:release-boundary
      - run: npm run release:plan
      - run: npm test
      - run: npm run test:package
      - name: Publish initial packages
        run: npm run release
        env:
          AETHER_NPM_AUTH_MODE: bootstrap-token
          AETHER_SDK_BOOTSTRAP_RELEASE_ENABLED: ${{ vars.AETHER_SDK_BOOTSTRAP_RELEASE_ENABLED }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          AETHER_SDK_SANDBOX_TOKEN_URL: ${{ vars.AETHER_SDK_SANDBOX_TOKEN_URL }}
          AETHER_SDK_SANDBOX_STORAGE_URL: ${{ vars.AETHER_SDK_SANDBOX_STORAGE_URL }}
          AETHER_SDK_SANDBOX_NAMESPACE_ID: ${{ vars.AETHER_SDK_SANDBOX_NAMESPACE_ID }}
          AETHER_SDK_SANDBOX_CLIENT_ID: ${{ secrets.AETHER_SDK_SANDBOX_CLIENT_ID }}
          AETHER_SDK_SANDBOX_CLIENT_SECRET: ${{ secrets.AETHER_SDK_SANDBOX_CLIENT_SECRET }}
